<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Hub — ICLR / ICML / NeurIPS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Paper Hub</h1>
    <div id="progress">加载中…</div>
  </header>
  <main>
    <aside id="sidebar">
      <input id="search" type="search" placeholder="关键词搜索（标题/摘要/作者）" autofocus />
      <fieldset id="quick-keywords">
        <legend>常用关键词</legend>
        <button type="button" data-q="prompt injection">prompt injection</button>
        <button type="button" data-q="coding agent">coding agent</button>
        <button type="button" data-q="ai security">ai security</button>
        <button type="button" data-q="coding agent security">coding agent security</button>
        <button type="button" data-q="watermark">watermark</button>
      </fieldset>
      <fieldset>
        <legend>会议</legend>
        <label><input type="checkbox" name="conf" value="ICLR" checked> ICLR</label>
        <label><input type="checkbox" name="conf" value="ICML" checked> ICML</label>
        <label><input type="checkbox" name="conf" value="NeurIPS" checked> NeurIPS</label>
        <label><input type="checkbox" name="conf" value="AAAI" checked> AAAI</label>
        <label><input type="checkbox" name="conf" value="NDSS" checked> NDSS</label>
      </fieldset>
      <fieldset id="year-filter"><legend>年份</legend></fieldset>
      <fieldset>
        <legend>排序</legend>
        <select id="sort">
          <option value="relevance">相关度</option>
          <option value="year-desc">年份新→旧</option>
        </select>
      </fieldset>
    </aside>
    <section id="results">
      <p class="hint">输入关键词或选择筛选条件</p>
    </section>
  </main>
  <script src="lib/minisearch.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
